<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Kick Halay - Webcam & Chatbox Boyutu</title>
<!--
  URL Ayarları (? / & ile):
    temiz=1   Sağ üstteki test panelini gizler (OBS için)
    sure=90   Etkileşim yoksa kaç saniye sonra kapansın (varsayılan: 90)
    hep=1     Etkileşim olmasa da sahneyi hep açık tutar
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Sağ Üst Deneme Paneli (?temiz=1 eklendiğinde gizlenir) */
  #test-paneli {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(15, 15, 20, 0.94);
    border: 2px solid #53fc18;
    border-radius: 10px;
    padding: 10px;
    color: #fff;
    z-index: 9999;
    width: 230px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
  }
  #test-paneli h4 {
    color: #53fc18;
    margin-bottom: 6px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .baglanti-durum {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: #444;
    color: #ddd;
  }
  #test-paneli input {
    width: 100%;
    padding: 5px 7px;
    margin-bottom: 5px;
    border-radius: 5px;
    border: 1px solid #444;
    background: #222;
    color: #fff;
    font-size: 12px;
  }
  .btn-grup {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .btn {
    flex: 1;
    padding: 5px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 11px;
    background: #53fc18;
    color: #000;
  }
  .btn-ikincil { background: #2a2a35; color: #fff; border: 1px solid #555; }

  /* KOMPAKT WEBCAM / CHATBOX BOYUTU (Varsayılan gizli, etkileşimle açılır) */
  #sahne-kapsayici {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%) translateY(28px) scale(0.96);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, transform 0.6s ease, visibility 0s linear 0.6s;
    width: 480px;
    height: 210px;
    pointer-events: none;
  }
  #sahne-kapsayici.aktif {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0) scale(1);
    transition: opacity 0.6s ease, transform 0.6s ease, visibility 0s;
  }

  /* Kompakt Yarı Saydam Platform */
  #platform {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 460px;
    height: 125px;
    background: radial-gradient(ellipse at center, rgba(83, 252, 24, 0.25) 0%, rgba(15, 20, 15, 0.7) 65%, rgba(0, 0, 0, 0) 100%);
    border-bottom: 2px solid rgba(83, 252, 24, 0.65);
    border-radius: 50%;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(83, 252, 24, 0.25);
  }

  /* Ortadaki Sabit Orkestra ve Kilim */
  :root { --ritim-suresi: 0.55s; }
  #kilim {
    position: absolute;
    left: 50%;
    bottom: 72px;
    width: 215px;
    height: 36px;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 2px solid #fbbf24;
    z-index: 40;
    background: repeating-linear-gradient(90deg,#b91c1c 0 10px,#7f1d1d 10px 13px,#1e3a8a 13px 23px,#7f1d1d 23px 26px);
    box-shadow: 0 6px 14px rgba(0,0,0,.65), inset 0 0 10px rgba(0,0,0,.55);
  }

  #orkestra {
    position: absolute;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    align-items: flex-end;
    z-index: 50;
  }
  .muzisyen { display: flex; flex-direction: column; align-items: center; position: relative; }

  .muzisyen-etiket {
    background: linear-gradient(135deg, #ffb700, #ff6a00);
    color: #000;
    font-weight: 800;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 8px;
    margin-bottom: 1px;
    white-space: nowrap;
    box-shadow: 0 2px 5px rgba(0,0,0,0.8);
    border: 1px solid #fff;
  }
  .muzisyen-rol {
    font-size: 9.5px;
    color: #ffd700;
    font-weight: bold;
    margin-bottom: 2px;
    text-shadow: 1px 1px 2px #000;
  }

  .karakter-govde {
    width: 52px;
    height: 64px;
    position: relative;
    transform-origin: 50% 100%;
    animation: orkestraRitim var(--ritim-suresi) infinite alternate ease-in-out;
  }
  .karakter-govde svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .muzisyen:nth-child(2) .karakter-govde { animation-delay: .15s; }
  .muzisyen:nth-child(3) .karakter-govde { animation-delay: .3s; }

  .nota {
    position: absolute;
    top: -12px;
    font-size: 13px;
    animation: notaUcus 1.6s infinite ease-out;
    opacity: 0;
  }
  @keyframes notaUcus {
    0% { transform: translateY(4px) scale(0.7); opacity: 1; }
    100% { transform: translateY(-24px) translateX(8px) scale(1.1); opacity: 0; }
  }

  /* Halay Çeken İzleyiciler */
  #halay-halkasi {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .halayci {
    position: absolute;
    transform: translate(-50%, -100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: left 0.45s ease, top 0.45s ease, opacity 0.35s ease;
  }
  .halayci svg { width: 38px; height: 53px; overflow: visible; display: block; }

  .izleyici-isim {
    background: rgba(10, 10, 15, 0.92);
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
    border: 1px solid #53fc18;
    margin-bottom: 2px;
    white-space: nowrap;
    max-width: 95px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 2px 5px rgba(0,0,0,0.9);
    text-shadow: 0 1px 2px #000;
  }
  .halaybasi .izleyici-isim {
    background: linear-gradient(90deg, #d40000, #ff4d00);
    border-color: #ffd700;
    color: #fff;
  }

  .halayci-ic { animation: halayAdim calc(var(--ritim-suresi) * 2) infinite ease-in-out; }
  .bacS, .bacD { animation: bacakAdim calc(var(--ritim-suresi) * 2) infinite ease-in-out; }
  .bacD { animation-delay: calc(var(--ritim-suresi) * -1); }
  .yelek, .mendilG { display: none; }
  .halaybasi .yelek, .halaybasi .mendilG { display: inline; }
  .mendilG { animation: mendilSalla calc(var(--ritim-suresi) * .7) infinite alternate ease-in-out; }
  body.zeybek-modu .halayci-ic { animation: zeybekOyun 2.2s infinite ease-in-out; }
  body.zeybek-modu .bacS, body.zeybek-modu .bacD { animation: none; }
  body.zeybek-modu .mendilG { display: none; }

  /* Alt Bilgi Bandı */
  #durum-bandi {
    position: absolute;
    bottom: 0px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid rgba(83, 252, 24, 0.55);
    color: #fff;
    padding: 2px 12px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: bold;
    z-index: 300;
    display: flex;
    gap: 12px;
    white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,0.7);
  }
  #durum-bandi span { color: #53fc18; }

  /* Animasyonlar */
  @keyframes orkestraRitim { 0% { transform: translateY(0) rotate(-1.5deg); } 100% { transform: translateY(-4px) rotate(1.5deg); } }
  @keyframes kafaSalla { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-2px); } }
  .m-kafa { animation: kafaSalla calc(var(--ritim-suresi) * 2) infinite ease-in-out; }
  @keyframes davulSol { 0%,100% { transform: rotate(12deg); } 50% { transform: rotate(-9deg); } }
  @keyframes davulSag { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(9deg); } }
  .davulSol { animation: davulSol calc(var(--ritim-suresi) * 2) infinite ease-in-out; }
  .davulSag { animation: davulSag calc(var(--ritim-suresi) * 2) infinite ease-in-out; animation-delay: calc(var(--ritim-suresi) * -1); }
  @keyframes davulVurus { 0%,100% { transform: scale(1.04,.97); } 50% { transform: scale(1); } }
  .m-davul { animation: davulVurus var(--ritim-suresi) infinite ease-out; animation-delay: calc(var(--ritim-suresi) * -.5); }
  @keyframes tusBas { 0% { transform: scaleY(.9); } 100% { transform: scaleY(1.06); } }
  .tus1 { animation: tusBas var(--ritim-suresi) infinite alternate ease-in-out; }
  .tus2 { animation: tusBas var(--ritim-suresi) infinite alternate ease-in-out; animation-delay: calc(var(--ritim-suresi) * -.5); }
  @keyframes parmak { 0% { transform: translateY(-2px); } 100% { transform: translateY(1px); } }
  .parmak1 { animation: parmak calc(var(--ritim-suresi) * .6) infinite alternate ease-in-out; }
  .parmak2 { animation: parmak calc(var(--ritim-suresi) * .6) infinite alternate ease-in-out; animation-delay: -.15s; }
  @keyframes flutSalla { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
  .m-flut { animation: flutSalla calc(var(--ritim-suresi) * 2) infinite ease-in-out; }
  @keyframes yildiz { 0%,100% { transform: scale(.5); opacity: .4; } 50% { transform: scale(1.2); opacity: 1; } }
  .yildiz { animation: yildiz 1.2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
  @keyframes halayAdim {
    0%,100% { transform: translate(-2px,0) rotate(-3deg); } 25% { transform: translate(0,-6px) rotate(0); }
    50% { transform: translate(2px,0) rotate(3deg); } 75% { transform: translate(0,-6px) rotate(0); }
  }
  @keyframes bacakAdim {
    0%,100% { transform: rotate(0); } 25% { transform: translate(0,-3px) rotate(-18deg); }
    50% { transform: rotate(0); } 75% { transform: rotate(8deg); }
  }
  @keyframes zeybekOyun { 0%,100% { transform: translateY(2px) rotate(-5deg); } 50% { transform: translateY(-2px) rotate(5deg); } }
  @keyframes mendilSalla { 0% { transform: rotate(-22deg); } 100% { transform: rotate(28deg); } }
</style>
</head>
<body>

<!-- SAĞ ÜST TEST PANELİ (OBS'te ?temiz=1 yapınca kaybolur) -->
<div id="test-paneli">
  <h4>
    <span>Kick Halay Kontrol</span>
    <span id="ws-durum" class="baglanti-durum">Bekleniyor</span>
  </h4>
  <input type="text" id="kanal-input" placeholder="ws://localhost:8787" />
  <button class="btn" style="width:100%; margin-bottom:8px;" onclick="kanalaBaglan()">Kick Sohbetine Bağlan</button>

  <input type="text" id="test-isim" placeholder="Test İzleyici Adı" value="Ahmet_01" />
  <div class="btn-grup">
    <button class="btn" onclick="manuelHalayEkle()">+ !halay</button>
    <button class="btn btn-ikincil" onclick="kalabalikEkle()">+5 Kişi</button>
    <button class="btn btn-ikincil" onclick="sahneyiTemizle()">Temizle</button>
  </div>
  <div class="btn-grup">
    <button class="btn btn-ikincil" onclick="tempoDegistir(0.32, '⚡ Hızlı')">⚡ Hızlan</button>
    <button class="btn btn-ikincil" onclick="tempoDegistir(0.55, '🥁 Normal')">🥁 Normal</button>
    <button class="btn btn-ikincil" onclick="zeybekModuAc()">🦅 Zeybek</button>
  </div>
</div>

<!-- WEBCAM / CHATBOX BOYUTUNDA KOMPAKT HALAY SAHNESİ (480x210) -->
<div id="sahne-kapsayici">
  <div id="platform"></div>
  <div id="kilim"></div>

  <!-- ORTADAKİ SABİT ORKESTRA -->
  <div id="orkestra">
    <div class="muzisyen">
      <div class="nota" style="left:2px;">🎵</div>
      <div class="muzisyen-etiket">@Ausec</div>
      <div class="muzisyen-rol">🥁 Davulcu</div>
      <div class="karakter-govde" id="svg-ausec"></div>
    </div>

    <div class="muzisyen">
      <div class="nota" style="left:14px; animation-delay:0.5s;">🎶</div>
      <div class="muzisyen-etiket">@anildegil</div>
      <div class="muzisyen-rol">🪈 Flütçü</div>
      <div class="karakter-govde" id="svg-anil"></div>
    </div>

    <div class="muzisyen">
      <div class="nota" style="left:6px; animation-delay:0.9s;">🎼</div>
      <div class="muzisyen-etiket">@Elfsec</div>
      <div class="muzisyen-rol">🎹 Piyanocu</div>
      <div class="karakter-govde" id="svg-elfsec"></div>
    </div>
  </div>

  <!-- İZLEYİCİLERİN DİZİLECEĞİ KOMPAKT HALAY HALKASI -->
  <div id="halay-halkasi"></div>

  <!-- ALT BİLGİ ÇUBUĞU -->
  <div id="durum-bandi">
    <div>Komut: <span>!halay</span></div>
    <div>Halay: <span id="kisi-sayisi">0</span> / 24</div>
    <div>Mod: <span id="aktif-mod">🥁 Normal</span></div>
  </div>
</div>

<script>
  // =========================================================================
  // 1. AYARLAR
  // =========================================================================
  const urlParams = new URLSearchParams(window.location.search);
  const MAX_HALAYCI = 24;
  const SURE_SN = Math.max(15, parseInt(urlParams.get("sure") || "90", 10));
  const HALAYDA_KALMA_SURESI = SURE_SN * 1000;
  const HEP_ACIK = urlParams.get("hep") === "1";

  if (urlParams.get("temiz") === "1") {
    document.getElementById("test-paneli").style.display = "none";
  }

  // =========================================================================
  // 2. KARAKTER VE ORKESTRA GÖRSELLERİ (SVG)
  // =========================================================================
  const K = "#1a1a1a";
  const kolCiz = (x1,y1,x2,y2,renk,w=7) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${K}" stroke-width="${w+3}" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${renk}" stroke-width="${w}" stroke-linecap="round"/>`;
  const elCiz = (x,y,deri) => `<circle cx="${x}" cy="${y}" r="4.5" fill="${deri}" stroke="${K}" stroke-width="2"/>`;
  const bacakCiz = (pant, ayakkabi) => `<rect x="30" y="76" width="12" height="28" rx="5" fill="${pant}" stroke="${K}" stroke-width="2"/><rect x="48" y="76" width="12" height="28" rx="5" fill="${pant}" stroke="${K}" stroke-width="2"/><ellipse cx="35" cy="105" rx="9" ry="4.5" fill="${ayakkabi}" stroke="${K}" stroke-width="2"/><ellipse cx="55" cy="105" rx="9" ry="4.5" fill="${ayakkabi}" stroke="${K}" stroke-width="2"/>`;
  const svgSar = (ic) => `<svg viewBox="0 0 90 110">${ic}</svg>`;
  const kafaCiz = (deri, arka, on, yuz) => `<g class="m-kafa" style="transform-origin:45px 50px">${arka}<circle cx="25" cy="33" r="4.5" fill="${deri}" stroke="${K}" stroke-width="2"/><circle cx="65" cy="33" r="4.5" fill="${deri}" stroke="${K}" stroke-width="2"/><circle cx="45" cy="31" r="20" fill="${deri}" stroke="${K}" stroke-width="2"/>${on}${yuz}</g>`;

  function ausecSvg() {
    const d = "#f0b48a";
    return svgSar(
      bacakCiz("#1f2937", "#111827") +
      `<path d="M24 46 Q45 40 66 46 Q75 64 67 82 Q45 91 23 82 Q15 64 24 46Z" fill="#fff" stroke="${K}" stroke-width="2"/>
       <path d="M45 48 V86" stroke="#d1d5db" stroke-width="1.5"/>
       <circle cx="45" cy="56" r="1.7" fill="#9ca3af"/><circle cx="45" cy="66" r="1.7" fill="#9ca3af"/><circle cx="45" cy="76" r="1.7" fill="#9ca3af"/>
       <path d="M33 68 q4 2 7 0 M50 68 q4 2 7 0" stroke="#d1d5db" stroke-width="1.5" fill="none" stroke-linecap="round"/>
       <path d="M33 43 L45 55 L57 43 L53 40 L45 47 L37 40Z" fill="#fff" stroke="${K}" stroke-width="1.8" stroke-linejoin="round"/>
       <g class="m-davul" style="transform-origin:45px 92px">
         <rect x="22" y="84" width="46" height="19" rx="6" fill="#b45309" stroke="${K}" stroke-width="2"/>
         <path d="M26 89 l5 12 l5 -12 l5 12 l5 -12 l5 12 l5 -12 l5 12 l5 -12" stroke="#fef3c7" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
         <ellipse cx="45" cy="84" rx="23" ry="8" fill="#fde68a" stroke="#78350f" stroke-width="3"/>
       </g>
       <g class="davulSol" style="transform-origin:27px 50px">${kolCiz(27,50,17,74,"#fff")}${elCiz(17,75,d)}<line x1="17" y1="75" x2="29" y2="86" stroke="#451a03" stroke-width="2.6" stroke-linecap="round"/></g>
       <g class="davulSag" style="transform-origin:63px 50px">${kolCiz(63,50,73,74,"#fff")}${elCiz(73,75,d)}<line x1="73" y1="75" x2="59" y2="86" stroke="#451a03" stroke-width="2.6" stroke-linecap="round"/><circle cx="58" cy="86.5" r="4" fill="#451a03"/></g>` +
      kafaCiz(d, "",
        `<path d="M26 29 Q24 9 45 9 Q66 9 64 29 Q61 19 45 18 Q29 19 26 29Z" fill="#1c1917" stroke="${K}" stroke-width="1.5"/>`,
        `<ellipse cx="45" cy="37" rx="3" ry="2.2" fill="#e09a70"/>
         <rect x="27" y="26" width="16" height="11" rx="4.5" fill="#0a0a0a"/><rect x="47" y="26" width="16" height="11" rx="4.5" fill="#0a0a0a"/>
         <path d="M43 30 H47" stroke="#0a0a0a" stroke-width="2.5"/><path d="M30 29 l5 -1 M50 29 l5 -1" stroke="#fff" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
         <path d="M35 41 Q45 36 55 41 Q45 40 35 41Z" fill="#1c1917" stroke="#1c1917" stroke-width="2" stroke-linejoin="round"/>
         <path d="M38 44 Q45 51 52 44Z" fill="#fff" stroke="#7f1d1d" stroke-width="1.6" stroke-linejoin="round"/>`)
    );
  }

  function anilSvg() {
    const d = "#fcd9b6";
    return svgSar(
      bacakCiz("#1e3a8a", "#f3f4f6") +
      `<path d="M27 46 Q45 40 63 46 L67 83 Q45 88 23 83Z" fill="#111827" stroke="${K}" stroke-width="2"/>
       <path d="M38 43 L45 82 L52 43Z" fill="#fff"/><path d="M38 43 L45 82 M52 43 L45 82" stroke="${K}" stroke-width="1.5" fill="none"/>
       <path d="M38 44 Q45 62 52 44" stroke="#d1d5db" stroke-width="1.6" fill="none"/><circle cx="45" cy="57" r="2.2" fill="#d1d5db" stroke="#6b7280" stroke-width=".8"/>` +
      kafaCiz(d, "",
        `<path d="M36 8 L38 -1 L44 7Z M46 6 L52 -3 L56 7Z" fill="#facc15" stroke="#a16207" stroke-width="1.3" stroke-linejoin="round"/>
         <path d="M24 30 Q19 9 40 6 Q58 1 69 15 Q71 23 65 30 Q62 20 50 19 Q38 17 31 26Z" fill="#facc15" stroke="#a16207" stroke-width="1.5" stroke-linejoin="round"/>
         <path d="M38 10 Q50 5 61 12" stroke="#fef08a" stroke-width="2" fill="none" stroke-linecap="round"/>
         <circle cx="22.5" cy="38" r="2.2" fill="#fbbf24" stroke="#92400e" stroke-width=".8"/>`,
        `<ellipse cx="37" cy="32" rx="2.4" ry="3" fill="#111"/><ellipse cx="53" cy="32" rx="2.4" ry="3" fill="#111"/>
         <circle cx="37.8" cy="30.8" r=".9" fill="#fff"/><circle cx="53.8" cy="30.8" r=".9" fill="#fff"/>
         <path d="M31 26 L42 28 M48 28 L59 26" stroke="#a16207" stroke-width="2.4" stroke-linecap="round"/>
         <path d="M45 34 q-2 4 1 5" stroke="#d99a6c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
         <path d="M38 43 Q46 47 54 41" stroke="#7f1d1d" stroke-width="2" fill="none" stroke-linecap="round"/>`) +
      `<g class="m-flut" style="transform-origin:46px 46px">
         <line x1="44" y1="45" x2="87" y2="72" stroke="${K}" stroke-width="7" stroke-linecap="round"/><line x1="44" y1="45" x2="87" y2="72" stroke="#e5e7eb" stroke-width="4.2" stroke-linecap="round"/>
         <circle cx="62" cy="57" r="1.3" fill="${K}"/><circle cx="69" cy="61.3" r="1.3" fill="${K}"/><circle cx="76" cy="65.6" r="1.3" fill="${K}"/>
         ${kolCiz(28,50,57,58,"#111827")}<g class="parmak1">${elCiz(58,58,d)}</g>
         ${kolCiz(62,50,75,64,"#111827")}<g class="parmak2">${elCiz(75,65,d)}</g>
       </g>`
    );
  }

  function elfsecSvg() {
    const d = "#ffe3d0", kr = "#e11d48";
    const tuslar = [0,1,2,3,4,5,6,7].map(i => `<line x1="${19.5+i*8.5}" y1="76" x2="${19.5+i*8.5}" y2="87" stroke="#9ca3af" stroke-width=".8"/>`).join("") +
                   [0,1,3,4,5].map(i => `<rect x="${17+i*8.5}" y="76" width="5" height="6.5" fill="#111"/>`).join("");
    return svgSar(
      bacakCiz("#7f1d1d", "#fff") +
      `<path d="M29 47 Q45 42 61 47 L64 80 Q45 86 26 80Z" fill="#dc2626" stroke="${K}" stroke-width="2"/>
       <path d="M45 70 C35 63 38 54 45 59 C52 54 55 63 45 70Z" fill="#fecdd3" stroke="#9f1239" stroke-width="1.2"/>
       <path d="M36 46 Q45 52 54 46" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
       <line x1="18" y1="88" x2="12" y2="104" stroke="#374151" stroke-width="3" stroke-linecap="round"/><line x1="72" y1="88" x2="78" y2="104" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
       <rect x="7" y="72" width="76" height="17" rx="3" fill="#1f2937" stroke="${K}" stroke-width="2"/><rect x="11" y="76" width="68" height="11" fill="#fff"/>${tuslar}
       <rect x="10" y="73.3" width="14" height="1.6" rx=".8" fill="#fb7185"/>
       <g class="tus1" style="transform-origin:31px 50px">${kolCiz(31,50,36,73,"#dc2626")}${elCiz(36,74,d)}</g>
       <g class="tus2" style="transform-origin:59px 50px">${kolCiz(59,50,54,73,"#dc2626")}${elCiz(54,74,d)}</g>
       <path class="yildiz" d="M80 14 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z" fill="#fde047"/>
       <path class="yildiz" style="animation-delay:.6s" d="M8 20 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5z" fill="#fde047"/>` +
      kafaCiz(d,
        `<ellipse cx="17" cy="46" rx="9" ry="18" fill="${kr}" stroke="${K}" stroke-width="2" transform="rotate(12 17 46)"/><ellipse cx="73" cy="46" rx="9" ry="18" fill="${kr}" stroke="${K}" stroke-width="2" transform="rotate(-12 73 46)"/>`,
        `<path d="M24 30 Q22 8 45 8 Q68 8 66 30 Q62 22 58 20 Q52 28 45 20 Q38 28 32 20 Q28 22 24 30Z" fill="${kr}" stroke="${K}" stroke-width="1.6" stroke-linejoin="round"/>
         <circle cx="23" cy="28" r="3.2" fill="#fde047" stroke="${K}" stroke-width="1.4"/><circle cx="67" cy="28" r="3.2" fill="#fde047" stroke="${K}" stroke-width="1.4"/>
         <path d="M31 12 L19 5 L20 19Z M31 12 L43 5 L42 19Z" fill="#fb7185" stroke="#9f1239" stroke-width="1.4" stroke-linejoin="round"/><circle cx="31" cy="12" r="3" fill="#be123c"/>`,
        `<ellipse cx="36" cy="33" rx="4.3" ry="5.3" fill="${K}"/><ellipse cx="54" cy="33" rx="4.3" ry="5.3" fill="${K}"/>
         <circle cx="37.6" cy="31" r="1.9" fill="#fff"/><circle cx="55.6" cy="31" r="1.9" fill="#fff"/><circle cx="34.6" cy="35.4" r="1" fill="#fff"/><circle cx="52.6" cy="35.4" r="1" fill="#fff"/>
         <ellipse cx="28" cy="40" rx="4" ry="2.5" fill="#fb7185" fill-opacity=".6"/><ellipse cx="62" cy="40" rx="4" ry="2.5" fill="#fb7185" fill-opacity=".6"/>
         <path d="M41 42 Q43.5 45.5 45 42 Q46.5 45.5 49 42" stroke="#7f1d1d" stroke-width="1.8" fill="none" stroke-linecap="round"/>`)
    );
  }

  const DERI = ["#fed7aa","#f5c9a0","#e0a979","#c68642","#8d5524"];
  const SAC = ["#1c1917","#3b2314","#7c4a1e","#c28f3b","#6b7280","#9a3412"];
  const GOMLEK = ["#53fc18","#22d3ee","#f43f5e","#facc15","#a78bfa","#fb923c","#38bdf8","#f472b6","#e5e7eb"];
  const PANTOLON = ["#1e293b","#334155","#1e3a8a","#3f3f46","#44403c"];
  function hashle(str) { let h = 2166136261; for (const c of str.toLowerCase()) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

  function halayciSvgOlustur(ad) {
    const h = hashle(ad), s = (n, a) => a[(h >>> n) % a.length];
    const deri = s(0, DERI), sac = s(3, SAC), ust = s(6, GOMLEK), pant = s(9, PANTOLON), kep = s(12, GOMLEK);
    const stil = (h >>> 15) % 5, gozluk = (h >>> 19) % 6 === 0;
    const st = `stroke="${K}" stroke-width="1.6"`;
    const kol = (t, x, ux) => `<line class="k${t}" x1="${x}" y1="41" x2="${ux}" y2="57" stroke="${K}" stroke-width="8.5" stroke-linecap="round"/><line class="k${t}" x1="${x}" y1="41" x2="${ux}" y2="57" stroke="${ust}" stroke-width="5.5" stroke-linecap="round"/><circle class="e${t}" cx="${ux}" cy="57" r="3.6" fill="${deri}" stroke="${K}" stroke-width="1.6"/>`;
    const arka = stil === 1 ? `<path d="M14 24 Q12 4 30 5 Q48 4 46 24 L48 40 Q41 38 40 29 L20 29 Q19 38 12 40Z" fill="${sac}" ${st} stroke-linejoin="round"/>` : "";
    const on = [
      `<path d="M16 21 Q15 6 30 6 Q45 6 44 21 Q40 13 30 13 Q20 13 16 21Z" fill="${sac}" ${st}/>`,
      `<path d="M16 21 Q15 6 30 6 Q45 6 44 21 Q38 11 30 14 Q22 11 16 21Z" fill="${sac}" ${st}/>`,
      `<path d="M16 19 Q15 5 30 5 Q45 5 44 19Z" fill="${kep}" ${st}/><path d="M29 18 Q45 15 53 19 Q41 23 29 20Z" fill="${kep}" ${st}/>`,
      `<path d="M16 21 Q15 6 30 6 Q45 6 44 21 Q40 13 30 13 Q20 13 16 21Z" fill="${sac}" ${st}/><circle cx="30" cy="4" r="5" fill="${sac}" ${st}/>`,
      `<path d="M15 19 Q14 2 30 2 Q46 2 45 19Z" fill="${kep}" ${st}/><rect x="14.5" y="14" width="31" height="5.5" rx="2.5" fill="#fff" fill-opacity=".35" ${st}/><circle cx="30" cy="2" r="3.4" fill="#fff" ${st}/>`
    ][stil];
    const goz = gozluk
      ? `<rect x="19" y="17.5" width="10" height="7.5" rx="2.5" fill="#0a0a0a"/><rect x="31" y="17.5" width="10" height="7.5" rx="2.5" fill="#0a0a0a"/><path d="M29 20 H31" stroke="#0a0a0a" stroke-width="2"/>`
      : `<ellipse cx="25" cy="22" rx="2" ry="2.7" fill="${K}"/><ellipse cx="35" cy="22" rx="2" ry="2.7" fill="${K}"/><circle cx="25.7" cy="20.8" r=".8" fill="#fff"/><circle cx="35.7" cy="20.8" r=".8" fill="#fff"/>`;
    return `<svg viewBox="0 0 60 84">${arka}
      <g class="bacS" style="transform-origin:25px 56px"><rect x="21" y="54" width="8" height="22" rx="4" fill="${pant}" stroke="${K}" stroke-width="1.8"/><ellipse cx="24" cy="77.5" rx="6" ry="3.2" fill="#f8fafc" ${st}/></g>
      <g class="bacD" style="transform-origin:35px 56px"><rect x="31" y="54" width="8" height="22" rx="4" fill="${pant}" stroke="${K}" stroke-width="1.8"/><ellipse cx="36" cy="77.5" rx="6" ry="3.2" fill="#f8fafc" ${st}/></g>
      <rect x="20" y="36" width="20" height="24" rx="7" fill="${ust}" stroke="${K}" stroke-width="2"/>
      <path class="yelek" d="M20 38 L27 36 L28 59 L20 59Z M40 38 L33 36 L32 59 L40 59Z" fill="#dc2626" stroke="${K}" stroke-width="1.5" stroke-linejoin="round"/>
      ${kol("S", 21, 14)}${kol("D", 39, 46)}
      <circle cx="16" cy="23" r="3" fill="${deri}" ${st}/><circle cx="44" cy="23" r="3" fill="${deri}" ${st}/>
      <circle cx="30" cy="21" r="14" fill="${deri}" stroke="${K}" stroke-width="2"/>
      ${on}${goz}
      <circle cx="21" cy="27" r="3" fill="#fb7185" fill-opacity=".45"/><circle cx="39" cy="27" r="3" fill="#fb7185" fill-opacity=".45"/>
      <path d="M25 27.5 Q30 34 35 27.5Z" fill="#7f1d1d" stroke="${K}" stroke-width="1.3" stroke-linejoin="round"/>
      <g class="mendilG" style="transform-origin:53px 13px"><path d="M53 13 Q62 1 71 7 Q69 18 59 22 Q55 18 53 13Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5" stroke-linejoin="round"/><path d="M71 7 Q69 18 59 22" stroke="#fde68a" stroke-width="1.6" fill="none" stroke-dasharray="2 2"/></g>
    </svg>`;
  }

  document.getElementById("svg-ausec").innerHTML = ausecSvg();
  document.getElementById("svg-anil").innerHTML = anilSvg();
  document.getElementById("svg-elfsec").innerHTML = elfsecSvg();

  // =========================================================================
  // 3. OTOMATİK GÖRÜNÜRLÜK + HALAY HALKASI
  // =========================================================================
  const halaycilar = [];
  const halkaAlani = document.getElementById("halay-halkasi");
  const sahneKapsayici = document.getElementById("sahne-kapsayici");
  let sahneGizleTimer = null;

  function sahneGoster() {
    clearTimeout(sahneGizleTimer);
    sahneKapsayici.classList.add("aktif");
  }

  function sahneKontrolEt() {
    if (HEP_ACIK) return;
    if (halaycilar.length === 0) {
      clearTimeout(sahneGizleTimer);
      sahneGizleTimer = setTimeout(() => {
        if (halaycilar.length === 0 && !HEP_ACIK) {
          sahneKapsayici.classList.remove("aktif");
          tempoDegistir(0.55, "🥁 Normal", true);
        }
      }, 1500);
    }
  }

  function sureleriUzat() {
    halaycilar.forEach(kisi => {
      clearTimeout(kisi.zamanlayici);
      kisi.zamanlayici = setTimeout(() => halaydanCikar(kisi.kullaniciAdi), HALAYDA_KALMA_SURESI);
    });
  }

  function halayaKatil(kullaniciAdi) {
    sahneGoster();
    const mevcut = halaycilar.find(h => h.kullaniciAdi.toLowerCase() === kullaniciAdi.toLowerCase());
    if (mevcut) {
      clearTimeout(mevcut.zamanlayici);
      mevcut.zamanlayici = setTimeout(() => halaydanCikar(mevcut.kullaniciAdi), HALAYDA_KALMA_SURESI);
      return;
    }
    if (halaycilar.length >= MAX_HALAYCI) halaydanCikar(halaycilar[halaycilar.length > 1 ? 1 : 0].kullaniciAdi);

    const div = document.createElement("div");
    div.className = "halayci";
    div.innerHTML = `<div class="izleyici-isim"></div><div class="halayci-ic">${halayciSvgOlustur(kullaniciAdi)}</div>`;
    halkaAlani.appendChild(div);

    const zamanlayici = setTimeout(() => halaydanCikar(kullaniciAdi), HALAYDA_KALMA_SURESI);
    halaycilar.push({ kullaniciAdi, element: div, zamanlayici });
    halkayiYenidenDiz();
  }

  function halaydanCikar(kullaniciAdi) {
    const index = halaycilar.findIndex(h => h.kullaniciAdi.toLowerCase() === kullaniciAdi.toLowerCase());
    if (index === -1) return;
    const kisi = halaycilar[index];
    clearTimeout(kisi.zamanlayici);
    kisi.element.style.opacity = "0";
    setTimeout(() => { if (kisi.element.parentNode) halkaAlani.removeChild(kisi.element); }, 350);
    halaycilar.splice(index, 1);
    halkayiYenidenDiz();
    sahneKontrolEt();
  }

  function sahneyiTemizle() {
    while (halaycilar.length) {
      halaydanCikar(halaycilar[0].kullaniciAdi);
    }
    sahneKontrolEt();
  }

  const YAY = (() => {
    const a = 205, b = 48, cx = 240, cy = 134, t = [{ s: 0, th: 0 }];
    let s = 0, px = cx + a, py = cy;
    for (let i = 1; i <= 600; i++) {
      const th = Math.PI * i / 600, x = cx + a * Math.cos(th), y = cy + b * Math.sin(th);
      s += Math.hypot(x - px, y - py); t.push({ s, th }); px = x; py = y;
    }
    return { t, L: s, a, b, cx, cy };
  })();

  function yayNokta(s) {
    const T = YAY.t; let i = 0;
    while (i < T.length - 2 && T[i + 1].s < s) i++;
    const A = T[i], B = T[i + 1], k = B.s > A.s ? Math.min(1, Math.max(0, (s - A.s) / (B.s - A.s))) : 0;
    const th = A.th + (B.th - A.th) * k;
    return { x: YAY.cx + YAY.a * Math.cos(th), y: YAY.cy + YAY.b * Math.sin(th) };
  }

  function kolKoy(sv, t, x, y) {
    sv.querySelectorAll(".k" + t).forEach(l => { l.setAttribute("x2", x); l.setAttribute("y2", y); });
    const e = sv.querySelector(".e" + t); e.setAttribute("cx", x); e.setAttribute("cy", y);
  }

  function halkayiYenidenDiz() {
    const n = halaycilar.length;
    document.getElementById("kisi-sayisi").innerText = n;
    if (!n) return;
    const aralik = Math.min(28, (YAY.L - 24) / Math.max(n - 1, 1));
    const s0 = (YAY.L - aralik * (n - 1)) / 2;
    const pts = halaycilar.map((_, i) => yayNokta(s0 + i * aralik));
    const olcek = 60 / 38;

    halaycilar.forEach((kisi, i) => {
      const p = pts[i], dugum = kisi.element, sv = dugum.querySelector("svg"), isim = dugum.querySelector(".izleyici-isim");
      dugum.classList.toggle("halaybasi", i === 0);
      isim.innerText = (i === 0 ? "🧣 " : "") + kisi.kullaniciAdi;
      isim.style.marginBottom = (n > 5 && i % 2) ? "15px" : "2px";
      dugum.style.left = p.x + "px";
      dugum.style.top = p.y + "px";
      dugum.style.zIndex = Math.round(p.y);

      if (zeybekAcik) { kolKoy(sv, "S", 0, 28); kolKoy(sv, "D", 60, 28); return; }
      const orta = (q) => [30 + ((q.x - p.x) * olcek) / 2, 54 + ((q.y - p.y) * olcek) / 2];
      const sol = pts[i + 1], sag = pts[i - 1];
      if (sol) kolKoy(sv, "S", ...orta(sol)); else kolKoy(sv, "S", 12, 58);
      if (i === 0) kolKoy(sv, "D", 53, 13); else kolKoy(sv, "D", ...orta(sag));
    });
  }

  let zeybekAcik = false;
  function tempoDegistir(saniye, modAdi, sessiz = false) {
    zeybekAcik = false;
    document.body.classList.remove("zeybek-modu");
    document.documentElement.style.setProperty("--ritim-suresi", `${saniye}s`);
    document.getElementById("aktif-mod").innerText = modAdi;
    halkayiYenidenDiz();
    if (!sessiz && halaycilar.length > 0) sureleriUzat();
  }

  function zeybekModuAc() {
    if (halaycilar.length === 0 && !HEP_ACIK) return;
    zeybekAcik = true;
    document.body.classList.add("zeybek-modu");
    document.getElementById("aktif-mod").innerText = "🦅 Zeybek";
    halkayiYenidenDiz();
    sureleriUzat();
  }

  // =========================================================================
  // 4. KICK SOHBET (yerel servis: ws://localhost:8787)
  // =========================================================================
  let aktifWs = null, yenidenZamanlayici = null;
  const VARSAYILAN_RELAY = urlParams.get("relay") || "ws://localhost:8787";

  let logKutusu = document.getElementById("ws-hata-log");
  if (!logKutusu) {
    logKutusu = document.createElement("div");
    logKutusu.id = "ws-hata-log";
    logKutusu.style.cssText = "font-size:10.5px; color:#facc15; background:#111; padding:5px; border-radius:5px; margin-bottom:6px; word-break:break-all; border:1px solid #333;";
    logKutusu.innerText = "Durum: aktarıcı bekleniyor...";
    const panel = document.getElementById("test-paneli");
    panel.insertBefore(logKutusu, panel.children[1]);
  }
  function logYaz(mesaj, renk = "#facc15") {
    console.log("[Kick]", mesaj);
    if (logKutusu) { logKutusu.style.color = renk; logKutusu.innerText = mesaj; }
  }

  function komutIsle(kullanici, mesaj, rozetli) {
    if (mesaj === "!halay" || mesaj === "halay" || mesaj.startsWith("!halay ")) halayaKatil(kullanici);
    else if (mesaj === "!hizlan" || mesaj === "!horon") { if (halaycilar.length > 0) tempoDegistir(0.30, "⚡ Hızlı"); }
    else if (mesaj === "!yavas" || mesaj === "!normal") { if (halaycilar.length > 0) tempoDegistir(0.55, "🥁 Normal"); }
    else if (mesaj === "!zeybek") { if (halaycilar.length > 0) zeybekModuAc(); }
    else if (mesaj === "!mendil") {
      if (!rozetli || halaycilar.length === 0) return;
      const idx = halaycilar.findIndex(h => h.kullaniciAdi.toLowerCase() === kullanici.toLowerCase());
      if (idx > 0) { const [kisi] = halaycilar.splice(idx, 1); halaycilar.unshift(kisi); halkayiYenidenDiz(); sureleriUzat(); }
    }
  }

  function kanalaBaglan() {
    const durumEtiketi = document.getElementById("ws-durum");
    const girilen = document.getElementById("kanal-input").value.trim();
    const adres = girilen.startsWith("ws") ? girilen : VARSAYILAN_RELAY;

    clearTimeout(yenidenZamanlayici);
    if (aktifWs) { aktifWs.onclose = null; aktifWs.close(); }

    durumEtiketi.innerText = "Aranıyor";
    durumEtiketi.style.background = "#d97706";
    aktifWs = new WebSocket(adres);

    aktifWs.onopen = () => {
      durumEtiketi.innerText = "Bağlı";
      durumEtiketi.style.background = "#16a34a";
      logYaz("Servise bağlandı, Kick bekleniyor...", "#4ade80");
    };
    aktifWs.onmessage = (e) => {
      let p; try { p = JSON.parse(e.data); } catch { return; }
      if (p.durum) { logYaz(p.durum, p.hata ? "#f87171" : "#4ade80"); return; }
      if (p.u && p.m !== undefined) {
        logYaz(`💬 ${p.u}: ${p.m}`, "#a78bfa");
        komutIsle(p.u, String(p.m).trim().toLowerCase(), Boolean(p.r));
      }
    };
    aktifWs.onclose = () => {
      durumEtiketi.innerText = "Yok";
      durumEtiketi.style.background = "#dc2626";
      logYaz("Servis kapalı. baslat.bat dosyasını açın.", "#f87171");
      yenidenZamanlayici = setTimeout(kanalaBaglan, 3000);
    };
  }

  // =========================================================================
  // 5. TEST PANELİ FONKSİYONLARI
  // =========================================================================
  let sahteSayac = 1;
  function manuelHalayEkle() {
    const input = document.getElementById("test-isim");
    const isim = input.value.trim() || `Izleyici_${sahteSayac}`;
    halayaKatil(isim);
    sahteSayac++;
    input.value = `Izleyici_${sahteSayac}`;
  }

  function kalabalikEkle() {
    const ornekIsimler = ["Kral_TR", "GeceGölgesi", "HalayBasi_34", "KickSever", "CayVer", "Mermi_01", "ZurnaAvcisi", "PiyanoBeyi"];
    for (let i = 0; i < 5; i++) {
      const rastgele = ornekIsimler[Math.floor(Math.random() * ornekIsimler.length)] + "_" + Math.floor(Math.random() * 99);
      halayaKatil(rastgele);
    }
  }

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("kanal-input").value = VARSAYILAN_RELAY;
    if (HEP_ACIK) sahneGoster();
    kanalaBaglan();
  });
</script>
</body>
